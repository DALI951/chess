<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شطرنجي — الشطرنج عبر الإنترنت</title>
<meta name="description" content="العب الشطرنج ضد الحاسوب أو ضد لاعبين حقيقيين. بالعربية والإنجليزية.">
<meta name="theme-color" content="#0a0a0c">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1.5 21 11 30.5 16 21 21 16 30.5 11 21 1.5 16 11 11Z' fill='%23e11d2e'/%3E%3Cpath d='M7.4 7.4H24.6V24.6H7.4Z' fill='none' stroke='%23e11d2e' stroke-width='2.4'/%3E%3C/svg%3E">
</head>
<body>

<a class="skip" href="#board-wrap" data-i18n="skipToBoard">تخطَّ إلى الرقعة</a>

<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" focusable="false">
        <path class="mark-a" d="M16 1.5 21 11 30.5 16 21 21 16 30.5 11 21 1.5 16 11 11Z"/>
        <path class="mark-b" d="M7.4 7.4H24.6V24.6H7.4Z"/>
      </svg>
    </span>
    <span class="brand-name" id="brandName">شطرنجي</span>
  </div>

  <nav class="nav" aria-label="main">
    <a class="nav-link is-active" href="#play" data-i18n="navPlay">العب</a>
    <a class="nav-link" href="#puzzles" data-i18n="navPuzzles">ألغاز</a>
    <a class="nav-link" href="#leaderboard" data-i18n="navLeaderboard">المتصدرون</a>
  </nav>

  <div class="top-actions">
    <div class="seg" role="group" aria-label="board theme">
      <button class="seg-btn" data-theme="dark" aria-pressed="true"><span class="swatch swatch-dark"></span><span class="sr-only">dark</span></button>
      <button class="seg-btn" data-theme="wood" aria-pressed="false"><span class="swatch swatch-wood"></span><span class="sr-only">wood</span></button>
      <button class="seg-btn" data-theme="contrast" aria-pressed="false"><span class="swatch swatch-contrast"></span><span class="sr-only">high contrast</span></button>
    </div>
    <button class="btn btn-ghost" id="langToggle" lang="en" type="button">
      <span id="langLabel">EN</span>
    </button>
  </div>
</header>

<main id="play" class="layout">

  <!-- ── board column ───────────────────────────────────────────── -->
  <section class="board-col">

    <div class="player" id="playerTop">
      <div class="player-id">
        <span class="avatar" id="topAvatar">♞</span>
        <span class="player-meta">
          <span class="player-name" id="topName">—</span>
          <span class="player-sub" id="topSub"></span>
        </span>
      </div>
      <div class="player-right">
        <span class="captured" id="topCaptured"></span>
        <span class="clock" id="topClock">10:00</span>
      </div>
    </div>

    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="chess board" tabindex="0"></div>
      <div class="board-veil" id="boardVeil" hidden>
        <div class="veil-card">
          <strong id="veilTitle"></strong>
          <span id="veilSub"></span>
          <div class="veil-actions" id="veilActions"></div>
        </div>
      </div>
    </div>

    <div class="player player-bottom" id="playerBottom">
      <div class="player-id">
        <span class="avatar" id="botAvatar">♟</span>
        <span class="player-meta">
          <span class="player-name" id="botName">—</span>
          <span class="player-sub" id="botSub"></span>
        </span>
      </div>
      <div class="player-right">
        <span class="captured" id="botCaptured"></span>
        <span class="clock" id="botClock">10:00</span>
      </div>
    </div>
  </section>

  <!-- ── side panel ─────────────────────────────────────────────── -->
  <aside class="panel">

    <div class="panel-tabs" role="tablist">
      <button class="tab is-active" role="tab" data-tab="game" aria-selected="true" data-i18n="tabGame">اللعبة</button>
      <button class="tab" role="tab" data-tab="moves" aria-selected="false" data-i18n="tabMoves">الحركات</button>
      <button class="tab" role="tab" data-tab="setup" aria-selected="false" data-i18n="tabSetup">الإعدادات</button>
    </div>

    <!-- game -->
    <div class="tabpane is-active" data-pane="game">
      <div class="field">
        <label for="mode" data-i18n="lblMode">الوضع</label>
        <select id="mode">
          <option value="ai" data-i18n="modeAi">ضد الحاسوب</option>
          <option value="duo" data-i18n="modeDuo">لاعبان على نفس الجهاز</option>
          <option value="online" data-i18n="modeOnline">عبر الإنترنت</option>
        </select>
      </div>

      <div class="field">
        <label for="timeControl" data-i18n="lblTime">الوقت</label>
        <select id="timeControl">
          <option value="180+2">3 + 2</option>
          <option value="300">5 + 0</option>
          <option value="600" selected>10 + 0</option>
          <option value="900+10">15 + 10</option>
          <option value="1800">30 + 0</option>
          <option value="custom" data-i18n="timeCustom">مخصص…</option>
          <option value="0" data-i18n="timeUnlimited">بدون وقت</option>
        </select>
      </div>

      <div class="field custom-tc" id="customTime" hidden>
        <div class="custom-row">
          <label for="tcMinutes" data-i18n="lblMinutes">الدقائق</label>
          <input type="number" id="tcMinutes" min="0" max="240" step="1" value="10" inputmode="numeric">
        </div>
        <div class="custom-row">
          <label for="tcIncrement" data-i18n="lblIncrement">الزيادة (ثانية)</label>
          <input type="number" id="tcIncrement" min="0" max="180" step="1" value="0" inputmode="numeric">
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="tcApply" data-i18n="btnApply">تطبيق</button>
        </div>
        <p class="hint" id="tcHint"></p>
      </div>

      <div class="field" id="levelField">
        <label for="level">
          <span data-i18n="lblLevel">مستوى الحاسوب</span>
          <span class="field-value"><output id="levelOut">1600</output></span>
        </label>
        <input type="range" id="level" min="400" max="3000" step="100" value="1600">
        <div class="range-ends"><span>400</span><span>3000</span></div>
      </div>

      <div class="field" id="colorField">
        <span class="label" data-i18n="lblColor">ألوانك</span>
        <div class="seg seg-wide" role="group">
          <button class="seg-btn is-on" data-color="w" data-i18n="colorWhite">أبيض</button>
          <button class="seg-btn" data-color="b" data-i18n="colorBlack">أسود</button>
          <button class="seg-btn" data-color="r" data-i18n="colorRandom">عشوائي</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="newGame" data-i18n="btnNewGame">لعبة جديدة</button>
      </div>

      <div class="btn-row btn-row-3">
        <button class="btn" id="undoBtn" data-i18n="btnUndo">تراجع</button>
        <button class="btn" id="flipBtn" data-i18n="btnFlip">قلب</button>
        <button class="btn btn-danger" id="resignBtn" data-i18n="btnResign">استسلام</button>
      </div>

      <!-- account: needed for online, and irrelevant to a game against the
           computer, so it only appears in online mode -->
      <section class="online" id="authPanel" hidden>
        <p class="hint" id="authWho" hidden></p>

        <form id="authForm" autocomplete="on">
          <div class="field">
            <label for="authName" data-i18n="authUser">اسم المستخدم</label>
            <input id="authName" name="username" autocomplete="username" minlength="3" maxlength="24" dir="ltr" required>
          </div>
          <div class="field" id="authDisplayField">
            <label for="authDisplay" data-i18n="authDisplay">الاسم الظاهر</label>
            <input id="authDisplay" name="nickname" maxlength="32">
          </div>
          <div class="field">
            <label for="authPass" data-i18n="authPass">كلمة المرور</label>
            <input id="authPass" name="password" type="password" autocomplete="current-password" minlength="8" required>
          </div>
          <label class="check">
            <input type="checkbox" id="authRemember"> <span data-i18n="authRemember">أبقني مسجّلًا</span>
          </label>
          <p class="hint" id="authHint"></p>
          <div class="btn-row btn-row-2">
            <button class="btn btn-primary" type="submit" id="authLoginBtn" data-i18n="btnLogin">دخول</button>
            <button class="btn" type="button" id="authRegisterBtn" data-i18n="btnRegister">حساب جديد</button>
          </div>
        </form>

        <button class="btn btn-ghost" id="authLogoutBtn" hidden data-i18n="btnLogout">خروج</button>
      </section>

      <!-- online: setup. This lives OUTSIDE #onlinePanel on purpose: the panel
           only exists once you are already in a game, so a "new room" button
           inside it means there is no way to open the first one. -->
      <section class="online" id="onlineSetup" hidden>
        <div class="field">
          <label for="onlineCodeInput" data-i18n="onlineJoinLabel">انضم بكود</label>
          <div class="inline-row">
            <input id="onlineCodeInput" maxlength="6" spellcheck="false" autocapitalize="characters" dir="ltr"
                   inputmode="latin" placeholder="ABC123">
            <button class="btn" id="onlineJoinGo" data-i18n="btnJoin">انضم</button>
          </div>
        </div>
        <button class="btn btn-primary" id="onlineQuick" data-i18n="btnQuickMatch">لعب سريع</button>
        <button class="btn" id="onlineCreate" data-i18n="btnCreateRoom">غرفة جديدة</button>
        <p class="hint" id="onlineHint"></p>
      </section>

      <!-- online: the game itself. Everything in here is a fact the server sent. -->
      <section class="online" id="onlinePanel" hidden aria-label="online">
        <div class="online-head">
          <span class="online-label" data-i18n="onlineRoom">الغرفة</span>
          <code class="online-code" id="onlineCode">—</code>
          <span class="online-status" id="onlineStatus">—</span>
        </div>

        <p class="hint" id="onlineOpponent">—</p>

        <div class="field" id="onlineOffer">
          <label for="onlineLink" data-i18n="onlineLinkLabel">رابط الدعوة</label>
          <div class="inline-row">
            <input id="onlineLink" readonly dir="ltr">
            <button class="btn btn-ghost" id="onlineCopy" data-i18n="btnCopy">نسخ</button>
            <button class="btn btn-ghost" id="onlineShare" data-i18n="btnShare">مشاركة</button>
          </div>
        </div>

        <button class="btn" id="onlineTakeSeat" hidden data-i18n="btnTakeSeat">اجلس في هذه الغرفة</button>

        <div class="chat" id="onlineChat">
          <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
          <form class="inline-row" id="chatForm">
            <input id="chatInput" maxlength="500" autocomplete="off" data-i18n-ph="chatPlaceholder" placeholder="اكتب رسالة…">
            <button class="btn btn-ghost" type="submit" data-i18n="btnSend">أرسل</button>
          </form>
        </div>

        <p class="hint warn" id="onlineDrawOffer" hidden>
          <span data-i18n="onlineDrawAsked">خصمك يطلب التعادل</span>
          <button class="btn btn-ghost" id="onlineDrawYes" data-i18n="btnAccept">قبول</button>
          <button class="btn btn-ghost" id="onlineDrawNo" data-i18n="btnDecline">رفض</button>
        </p>

        <div class="btn-row btn-row-2">
          <button class="btn" id="onlineDraw" hidden data-i18n="btnOfferDraw">اعرض التعادل</button>
          <button class="btn btn-ghost" id="onlineLeave" hidden data-i18n="btnLeave">خروج</button>
        </div>
      </section>

      <div class="stat-row" id="gameStats">
        <div class="stat"><span class="stat-k" data-i18n="statMoves">الحركات</span><span class="stat-v" id="statMoves">0</span></div>
        <div class="stat"><span class="stat-k" data-i18n="statEval">التقييم</span><span class="stat-v" id="statEval">—</span></div>
      </div>
    </div>

    <!-- moves -->
    <div class="tabpane" data-pane="moves">
      <div class="moves" id="moveList" role="log" aria-live="polite"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="copyPgn" data-i18n="btnCopyPgn">نسخ PGN</button>
        <button class="btn btn-ghost" id="copyFen" data-i18n="btnCopyFen">نسخ FEN</button>
      </div>
    </div>

    <!-- setup -->
    <div class="tabpane" data-pane="setup">
      <div class="field">
        <label for="fenInput" data-i18n="lblFen">موقف مخصص (FEN)</label>
        <textarea id="fenInput" rows="3" spellcheck="false" dir="ltr"></textarea>
        <p class="hint" id="fenHint" data-i18n="hintFen">اتركه فارغًا للعبة جديدة من البداية.</p>
      </div>
      <div class="btn-row">
        <button class="btn" id="loadFen" data-i18n="btnLoadFen">تحميل</button>
        <button class="btn btn-ghost" id="clearFen" data-i18n="btnClearFen">مسح</button>
      </div>
      <p class="note" data-i18n="noteSetup">تحميل موقف محفوظ، ومشاركة رابط اللعبة، وتثبيت النتيجة.</p>
    </div>
  </aside>
</main>

<footer class="foot">
  <span data-i18n="footTag">محرك قواعده مُختبَر بسبعة ملايين عقدة.</span>
</footer>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
